services:
  - type: web
    name: codeclever-api
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: node --max-old-space-size=384 server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        value: 4000
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_NAME
        value: code_clever
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://codeclever.com"
      - key: FRONTEND_URL
        value: "https://codeclever.com"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ALTCHA_HMAC_KEY
        generateValue: true
